# CI: every project check (spec.md §9) on a GitHub runner. No deploy here.
# Lighthouse runs on CI hardware because the local machine is below Lighthouse's
# reliability floor for performance scores (see plan.md M5).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: astro check + eslint + guard
        run: npm run check

      - name: i18n parity
        run: npm run i18n-parity

      - name: Links
        run: npm run links

      - name: Lighthouse (perf / a11y / SEO >= 95 on /tr/ and /en/)
        run: npm run lighthouse

      - name: Lighthouse scores to job summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const p = "reports/lighthouse/manifest.json";
            if (!fs.existsSync(p)) { console.log("no lighthouse manifest"); process.exit(0); }
            const rows = JSON.parse(fs.readFileSync(p, "utf8")).map((r) => {
              const s = r.summary, pct = (x) => Math.round(x * 100);
              return `| ${new URL(r.url).pathname} | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s["best-practices"])} | ${pct(s.seo)} |`;
            });
            const md = ["| Page | Performance | Accessibility | Best practices | SEO |", "|---|---|---|---|---|", ...rows].join("\n");
            console.log(md);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
